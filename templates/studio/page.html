{% load static %}<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ title }} | Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="icon" type="image/png" href="{% static 'assets/images/navbar/FaviconPortfolioLogo.png' %}">
</head>

{# Every Studio page is a shell: its script loads the content from /studio/api/ #}
<body class="home-page survey-page editor-page studio-page" data-page="{{ page }}">
    <header class="ed-top">
        <div class="ed-top__inner">
            <a class="ed-top__brand" href="{% url 'studio:dashboard' %}" title="Studio home">
                <img src="{% static 'assets/images/navbar/PortfolioLogo.svg' %}" width="500" height="188" alt="Studio home">
            </a>
            <div class="ed-top__title">
                <span class="ed-top__eyebrow">Studio</span>
                <span class="ed-top__name" id="st-title">{{ title }}</span>
            </div>
            <span class="ed-save" id="ed-save" role="status" aria-live="polite"></span>
            <a class="btn btn--ghost ed-top__btn" id="st-preview" href="/" target="_blank" rel="noopener" hidden>Preview <span aria-hidden="true">&nearr;</span></a>
        </div>
        <nav class="ed-tabs st-nav" aria-label="Studio">
            <a class="ed-tab" href="{% url 'studio:dashboard' %}"{% if page == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
            <a class="ed-tab" href="{% url 'studio:projects' %}"{% if page == 'projects' or page == 'project' %} aria-current="page"{% endif %}>Projects</a>
            <a class="ed-tab" href="{% url 'studio:about' %}"{% if page == 'about' %} aria-current="page"{% endif %}>About</a>
            <a class="ed-tab" href="/msc-survey/edit/">Survey</a>
            <a class="ed-tab" href="{{ admin_url }}">Admin</a>
            <a class="ed-tab" href="/" target="_blank" rel="noopener">View site <span aria-hidden="true">&nearr;</span></a>
        </nav>
    </header>

    <div class="ed-layout st-layout">
        <main class="ed-main st-main" id="ed-main" tabindex="-1">
            <p class="ed-note">Loading&hellip;</p>
            <noscript><p>Studio needs JavaScript.</p></noscript>
        </main>
    </div>

    <script src="{% static 'studio/kit.js' %}" defer></script>
    <script src="{% static script %}" defer></script>
</body>
</html>
