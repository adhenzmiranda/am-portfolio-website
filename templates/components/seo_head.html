{% load static %}{% static 'assets/images/hero/desktop1-pfp.png' as default_og_image %}
    <!-- SEO: title, description, canonical and social previews -->
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page_description }}">
    <link rel="canonical" href="{{ SITE_URL }}{% firstof canonical_path request.path %}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Adhenz Miranda">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:url" content="{{ SITE_URL }}{% firstof canonical_path request.path %}">
    <meta property="og:image" content="{% if og_image %}{{ og_image }}{% else %}{{ SITE_URL }}{{ default_og_image }}{% endif %}">
    <meta name="twitter:card" content="summary_large_image">
    {% if json_ld %}<script type="application/ld+json">{{ json_ld }}</script>{% endif %}
