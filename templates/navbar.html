{% load static %}{% with page=request.resolver_match.url_name %}
<header class="site-header" data-site-header>
    <nav class="navbar" aria-label="Main">
        <a class="navbar-brand" href="{% url 'home' %}">
            <img class="navbar-logo" src="{% static 'assets/images/navbar/PortfolioLogo.svg' %}" width="500" height="188" alt="Adhenz Miranda, home">
        </a>

        <ul class="navbar-links">
            <li><a href="{% url 'home' %}" class="nav-link{% if page == 'home' %} is-active{% endif %}"{% if page == 'home' %} aria-current="page"{% endif %}>Home</a></li>
            <li><a href="{% url 'about' %}" class="nav-link{% if page == 'about' %} is-active{% endif %}"{% if page == 'about' %} aria-current="page"{% endif %}>About</a></li>
            <li><a href="{% url 'projects_page' %}" class="nav-link{% if page == 'projects_page' or page == 'project_detail' %} is-active{% endif %}"{% if page == 'projects_page' or page == 'project_detail' %} aria-current="page"{% endif %}>Projects</a></li>
            <li><a href="{% url 'contact' %}" class="nav-link{% if page == 'contact' %} is-active{% endif %}"{% if page == 'contact' %} aria-current="page"{% endif %}>Contact</a></li>
        </ul>

        <button class="toggle-nav-btn" type="button" aria-expanded="false" aria-controls="mobile-menu">
            <span class="toggle-nav-btn__bar" aria-hidden="true"></span>
            <span class="toggle-nav-btn__bar" aria-hidden="true"></span>
            <span class="toggle-nav-btn__label">Open menu</span>
        </button>
    </nav>
</header>

<!-- Phone menu: full screen, opened by .toggle-nav-btn -->
<div class="mobile-menu" id="mobile-menu" aria-label="Menu" hidden>
    <ol class="mobile-menu__links">
        <li><a href="{% url 'home' %}" class="mobile-menu__link{% if page == 'home' %} is-active{% endif %}"{% if page == 'home' %} aria-current="page"{% endif %}><span class="mobile-menu__num">01</span>Home</a></li>
        <li><a href="{% url 'about' %}" class="mobile-menu__link{% if page == 'about' %} is-active{% endif %}"{% if page == 'about' %} aria-current="page"{% endif %}><span class="mobile-menu__num">02</span>About</a></li>
        <li><a href="{% url 'projects_page' %}" class="mobile-menu__link{% if page == 'projects_page' or page == 'project_detail' %} is-active{% endif %}"{% if page == 'projects_page' or page == 'project_detail' %} aria-current="page"{% endif %}><span class="mobile-menu__num">03</span>Projects</a></li>
        <li><a href="{% url 'contact' %}" class="mobile-menu__link{% if page == 'contact' %} is-active{% endif %}"{% if page == 'contact' %} aria-current="page"{% endif %}><span class="mobile-menu__num">04</span>Contact</a></li>
    </ol>
    <div class="mobile-menu__social">
        {% include "components/social_links.html" %}
    </div>
</div>
{% endwith %}

<div class="scroll-progress" aria-hidden="true">
    <div class="scroll-progress__bar"></div>
</div>

<script src="{% static 'js/components/navbar.js' %}" defer></script>
<script src="{% static 'js/parallax.js' %}" defer></script>
<script src="{% static 'js/main.js' %}" defer></script>
<script src="{% static 'js/components/scrollProgress.js' %}" defer></script>
