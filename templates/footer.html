{% load static %}
<footer class="footer">
    <div class="footer-logo-container">
        <a href="{% url 'home' %}">
            <img class="footer-logo" src="{% static 'assets/images/navbar/PortfolioLogo.png' %}" width="500" height="188" alt="Adhenz Miranda logo" loading="lazy">
        </a>
    </div>

    <div class="socials-icons">
        {% include "components/social_links.html" with lazy=True %}
    </div>

    <div class="page-links">
        <a href="{% url 'home' %}">Home</a>
        <span class="separator">|</span>
        <a href="{% url 'about' %}">About</a>
        <span class="separator">|</span>
        <a href="{% url 'projects_page' %}">Projects</a>
        <span class="separator">|</span>
        <a href="{% url 'contact' %}">Contact Me</a>
        <span class="separator">|</span>
        <a href="{% static 'assets/files/Adhenz-Miranda-CV.pdf' %}" download>Download CV</a>
    </div>

    <div class="copyright">
        <p>
            &copy; {% now 'Y' %} Adhenz Miranda. All rights reserved.<br>
            Source code licensed under the <a href="https://opensource.org/licenses/MIT" target="_blank" rel="license noopener noreferrer">MIT License</a>.
        </p>
    </div>

    <div class="footer-last-updated">
        <p>Last updated: {% now "m-d-Y" %}</p>
    </div>

    <div class="powered-by">
        <p>POWERED BY</p>
        <span class="separator">|</span>
        <a href="https://www.heroku.com" target="_blank" rel="noopener noreferrer" class="heroku-logo">
            <img src="{% static 'assets/tech-stack-used/heroku.png' %}" width="198" height="70" alt="Heroku" loading="lazy">
        </a>
    </div>
</footer>
